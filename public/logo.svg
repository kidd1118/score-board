<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="badge"><rect x="88" y="16" width="272" height="440" rx="56"/></clipPath>
  </defs>
  <!-- league-style badge: blue / red split -->
  <g clip-path="url(#badge)">
    <rect x="88" y="16" width="136" height="440" fill="#1d428a"/>
    <rect x="224" y="16" width="136" height="440" fill="#c8102e"/>
  </g>
  <rect x="88" y="16" width="272" height="440" rx="56" fill="none" stroke="#fff" stroke-width="10"/>
  <!-- basketball -->
  <g fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round">
    <circle cx="224" cy="170" r="88"/>
    <line x1="224" y1="82" x2="224" y2="258"/>
    <line x1="136" y1="170" x2="312" y2="170"/>
    <path d="M162 108 Q206 170 162 232"/>
    <path d="M286 108 Q242 170 286 232"/>
  </g>
  <!-- casino chip -->
  <g transform="translate(352 368)">
    <circle r="132" fill="#fff"/>
    <circle r="120" fill="#111"/>
    <g fill="#fff">
      <rect x="-18" y="-120" width="36" height="34" rx="4"/>
      <rect x="-18" y="-120" width="36" height="34" rx="4" transform="rotate(60)"/>
      <rect x="-18" y="-120" width="36" height="34" rx="4" transform="rotate(120)"/>
      <rect x="-18" y="-120" width="36" height="34" rx="4" transform="rotate(180)"/>
      <rect x="-18" y="-120" width="36" height="34" rx="4" transform="rotate(240)"/>
      <rect x="-18" y="-120" width="36" height="34" rx="4" transform="rotate(300)"/>
    </g>
    <circle r="72" fill="#f5b700" stroke="#fff" stroke-width="8"/>
    <circle r="56" fill="none" stroke="#111" stroke-width="4" stroke-dasharray="10 8"/>
    <text y="22" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="64" fill="#111">$</text>
  </g>
</svg>
